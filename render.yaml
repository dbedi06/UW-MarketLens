# Render Blueprint — deploys both services from this repo.
# Dashboard: New + > Blueprint > pick this repo > Apply.
# Auto-deploys on every push to the connected branch.
services:
  # ---- FastAPI backend (free web service; sleeps after 15 min idle) ----
  - type: web
    name: marketlens-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Pin Python: pydantic-core 2.27.2 has no wheel for 3.14 (Render's
      # default) and falls back to a Rust source build that fails on the
      # read-only FS. 3.12 has prebuilt wheels.
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Set this to the marketlens-web URL after its first deploy
      # (e.g. https://marketlens-web.onrender.com), then redeploy.
      - key: FRONTEND_ORIGIN
        sync: false
      # Allow POST /api/live/score to fetch from Polymarket on cache miss.
      # Without this, the live route returns 503 for any URL the cache
      # hasn't seen. Cached responses are written back to
      # backend/app/ingestion/cache/ so each unique market is fetched once.
      - key: MARKETLENS_POLYMARKET_LIVE
        value: "1"
      # S4 LLM-as-judge (resolution checker) + S5 tagger. Paste your
      # NewsAPI key and OpenRouter key in the Render dashboard once.
      # Without NEWS_API_KEY or OPENROUTER_API_KEY the resolution leg
      # falls back to UNVERIFIABLE / resolution_quality=0 (documented).
      # Default model: meta-llama/llama-3.3-70b-instruct:free.
      #
      # Recommended paid setup (set both):
      #   OPENROUTER_MODEL    = deepseek/deepseek-v4-pro
      #   OPENROUTER_PROVIDER = deepinfra
      # The provider pin matters — DeepSeek V4 Pro is several times
      # more expensive via Fireworks/Together than via DeepInfra.
      # Without the pin OpenRouter may silently route to the
      # expensive provider during rate-limit spikes.
      #
      # Why DeepInfra and not the DeepSeek-direct provider:
      # OpenRouter requires every account to opt into the DeepSeek
      # provider's data-retention policy at
      # https://openrouter.ai/settings/privacy before routing there
      # — without that, requests pinned to `deepseek` return
      # `404 "No endpoints available matching your guardrail
      # restrictions"`. DeepInfra serves the same model under a
      # standard OpenRouter privacy posture and doesn't need an
      # extra opt-in. If you've already opted in, `deepseek` works
      # too and is marginally cheaper.
      #
      # OPENROUTER_FALLBACK_MODEL (default google/gemini-2.0-flash-lite-001)
      # is what the client tries when the primary model exhausts its
      # retries. The fallback runs without the provider pin so it has
      # a clean path even if DeepSeek itself is down.
      - key: NEWS_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        sync: false
      - key: OPENROUTER_PROVIDER
        sync: false
      - key: OPENROUTER_FALLBACK_MODEL
        sync: false

  # ---- Vite/React frontend (free static site; always-on) ----
  - type: web
    name: marketlens-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # SPA: route all paths to index.html so client-side routing works.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Set this to the marketlens-api URL after its first deploy
      # (e.g. https://marketlens-api.onrender.com), then redeploy.
      - key: VITE_API_URL
        sync: false
